<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rally Drift — Endless Top-Down Racer</title>
<style>
  * {
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: none;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #1a2e1a;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: 'Segoe UI', Arial, sans-serif;
    overscroll-behavior: none;
  }
  #gameCanvas { display: block; background: #3a6b3a; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 16px; pointer-events: none; color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    z-index: 5;
  }
  #hud .score-block { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
  #hud .sub { font-size: 12px; font-weight: 500; opacity: 0.85; margin-top: 2px; }
  #hud .best-block { text-align: right; font-size: 13px; font-weight: 600; opacity: 0.9; }

  #muteBtn {
    position: fixed; top: 62px; right: 14px; width: 34px; height: 34px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.35);
    color: #fff; font-size: 15px; z-index: 20; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
  }

  #steerPad {
    position: fixed; bottom: 22px; left: 18px; z-index: 15;
    display: flex; gap: 8px;
  }
  #steerPad.pad-right { left: auto; right: 18px; }
  .steer-btn {
    width: 72px; height: 92px; border-radius: 16px;
    background: rgba(255,255,255,0.14); border: 3px solid rgba(255,255,255,0.45);
    color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center;
    z-index: 15; pointer-events: auto; -webkit-tap-highlight-color: transparent;
  }
  .steer-btn:active, .steer-btn.pressed { background: rgba(255,255,255,0.32); transform: scale(0.94); }

  #pedalBtn {
    position: fixed; bottom: 26px; right: 18px; width: 78px; height: 118px;
    border-radius: 16px; border: 3px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.14); color: #fff; font-weight: 800; font-size: 15px;
    letter-spacing: 1px; z-index: 15; pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  #pedalBtn.pressed {
    background: linear-gradient(180deg,#ff8a3d,#e8452a);
    border-color: rgba(255,255,255,0.8); transform: scale(0.96);
  }
  #pedalBtn.pedal-left { left: 18px; right: auto; }

  #speedBar {
    position: fixed; top: 106px; right: 16px; width: 12px; height: 100px; z-index: 15;
    border-radius: 7px; border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.35); overflow: hidden;
  }
  #speedBarFill {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
    background: hsl(130,85%,50%); border-radius: 5px 5px 0 0;
  }

  #fuelBar {
    position: fixed; top: 106px; left: 16px; width: 12px; height: 100px; z-index: 15;
    border-radius: 7px; border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.35); overflow: hidden;
  }
  #fuelBarFill {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
    background: #ffb020; border-radius: 5px 5px 0 0; transition: background 0.3s;
  }
  #fuelBar.critical #fuelBarFill { animation: fuelBlink 0.6s infinite; }
  @keyframes fuelBlink { 0%,100% { background:#ff3b30; } 50% { background:#ffb020; } }

  #sideToggle {
    display: flex; align-items: center; gap: 8px; margin-top: 4px; margin-bottom: 6px;
  }
  #sideToggle .sideLabel { font-size: 12px; opacity: 0.75; letter-spacing: 1px; }
  #sideToggle .sideBtn {
    padding: 7px 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
    border-radius: 16px; border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75);
  }
  #sideToggle .sideBtn.active {
    background: rgba(255,255,255,0.85); color: #1a2e1a; border-color: rgba(255,255,255,0.85);
  }

  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(10, 20, 10, 0.72); color: #fff; z-index: 30; padding: 24px;
  }
  #overlay h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: 1px; }
  #overlay .tagline { opacity: 0.85; margin-bottom: 22px; font-size: 14px; max-width: 280px; }
  #overlay .stat { font-size: 15px; margin: 4px 0; opacity: 0.9; }
  #overlay .bigStat { font-size: 40px; font-weight: 800; margin: 6px 0 14px; }
  #startBtn {
    margin-top: 18px; padding: 14px 38px; font-size: 18px; font-weight: 700;
    background: linear-gradient(180deg,#ff5b3d,#d63a1f); border: none; border-radius: 30px;
    color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.4); letter-spacing: 0.5px;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div>
    <div class="score-block" id="scoreDisplay">0 m</div>
    <div class="sub" id="speedDisplay">0 km/h</div>
  </div>
  <div class="best-block">BEST<br><span id="bestDisplay">0</span> m</div>
</div>

<button id="muteBtn">🔊</button>
<div id="steerPad">
  <button class="steer-btn" id="leftBtn">◀</button>
  <button class="steer-btn" id="rightBtn">▶</button>
</div>
<button id="pedalBtn">GAS</button>
<div id="speedBar"><div id="speedBarFill"></div></div>
<div id="fuelBar"><div id="fuelBarFill"></div></div>

<div id="overlay">
  <h1 id="overlayTitle">RALLY DRIFT</h1>
  <div class="tagline" id="overlayTagline">Top-down endless rally. Hold GAS with one thumb, steer with the other — the arrows are together on one side so a single thumb can reach both.</div>
  <div id="resultStats" style="display:none;">
    <div class="bigStat" id="finalScore">0 m</div>
    <div class="stat" id="newBestTag" style="display:none; color:#ffd54a;">🏆 New Best!</div>
  </div>
  <div id="sideToggle">
    <span class="sideLabel">GAS:</span>
    <button class="sideBtn" data-side="left">LEFT</button>
    <button class="sideBtn" data-side="right">RIGHT</button>
  </div>
  <button id="startBtn">START</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Kill long-press context menu, text selection, double-tap zoom and any residual browser gestures
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ---------- Audio (simple procedural engine hum + crash noise) ----------
  let actx = null, engineOsc = null, engineGain = null, muted = false;
  function initAudio(){
    if (actx){
      if (actx.state === 'suspended') actx.resume().catch(()=>{});
      return;
    }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      engineOsc = actx.createOscillator();
      engineGain = actx.createGain();
      engineOsc.type = 'sawtooth';
      engineOsc.frequency.value = 60;
      engineGain.gain.value = 0;
      engineOsc.connect(engineGain).connect(actx.destination);
      engineOsc.start();
      if (actx.state === 'suspended') actx.resume().catch(()=>{});
    } catch(e){ actx = null; }
  }
  function setEngine(speedRatio, running){
    if (!actx || muted) return;
    engineOsc.frequency.setTargetAtTime(55 + speedRatio*140, actx.currentTime, 0.08);
    engineGain.gain.setTargetAtTime(running ? 0.045 : 0, actx.currentTime, 0.1);
  }
  function playCrash(){
    if (!actx || muted) return;
    const bufSize = actx.sampleRate * 0.35;
    const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const g = actx.createGain(); g.gain.value = 0.35;
    src.connect(g).connect(actx.destination);
    src.start();
  }
  function playRefuel(){
    if (!actx || muted) return;
    [660, 880].forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const t0 = actx.currentTime + i*0.08;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.18);
      osc.connect(g).connect(actx.destination);
      osc.start(t0); osc.stop(t0+0.2);
    });
  }
  document.getElementById('muteBtn').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
    if (muted && engineGain) engineGain.gain.setTargetAtTime(0, actx.currentTime, 0.05);
  });

  // ---------- Game state ----------
  let state = 'idle'; // idle | playing | crashed
  let distanceTraveled = 0;   // for scoring / difficulty ramp
  const MIN_SPEED = 130, MAX_SPEED = 620;
  let speed = 300;
  let roadWidth = 240;
  const STEP = 20; // world-unit spacing of generated track points

  // ---------- Scenery biomes — the route periodically switches between these ----------
  const BIOMES = {
    tarmac:  { road:'#5b5b5b', stripeA:'#e6473b', stripeB:'#f2f2f2', bg:'#3a6b3a', bg2:'rgba(0,0,0,0.06)', treeTint:'#2f5e2a', treeTint2:'#376b32', trunk:'#4a3222', curbs:true, dust:'195,195,198', dustRate:0.35, dustSize:1.0 },
    dusty:   { road:'#c9a15a', stripeA:'#8a5a2b', stripeB:'#f2e2b8', bg:'#d9bd7c', bg2:'rgba(0,0,0,0.05)', treeTint:'#8a8140', treeTint2:'#a69a4f', trunk:'#6b4a26', dust:'216,178,110', dustRate:1, dustSize:1.9 },
    gravel:  { road:'#cfcac0', stripeA:'#4a4a4a', stripeB:'#ffffff', bg:'#8f9a7c', bg2:'rgba(0,0,0,0.08)', treeTint:'#2e4a34', treeTint2:'#3a5a40', trunk:'#3a352e', dust:'222,222,215', dustRate:0.95, dustSize:1.6 },
    coastal: { road:'#c7b88f', stripeA:'#1f6fb2', stripeB:'#ffffff', bg:'#2f7fc1', bg2:'rgba(255,255,255,0.08)', sand:'#e8d9a8', sandWidth:64, noTrees:true, dust:'232,222,190', dustRate:0.2, dustSize:0.8 }
  };
  const BIOME_NAMES = Object.keys(BIOMES);
  let biomeName = 'tarmac', nextBiomeChangeDist = 1900;
  let pendingBiome = null, transitionStartDist = 0;
  const TRANSITION_LEN = 280; // world units over which colors blend into the new biome

  function hexToRgb(hex){
    const n = parseInt(hex.slice(1), 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function lerpColor(hexA, hexB, t){
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(a[0]+(b[0]-a[0])*t);
    const g = Math.round(a[1]+(b[1]-a[1])*t);
    const bl = Math.round(a[2]+(b[2]-a[2])*t);
    return `rgb(${r},${g},${bl})`;
  }
  function shadeRGB(rgbStr, factor){
    const [r,g,b] = rgbStr.split(',').map(Number);
    const c = v => Math.max(0, Math.min(255, Math.round(v*factor)));
    return `${c(r)},${c(g)},${c(b)}`;
  }

  // Car lives in free 2D world space; screen position is always fixed.
  const CAR_SCREEN_X_RATIO = 0.5, CAR_SCREEN_Y_RATIO = 0.74;
  let car = { wx: 0, wy: 0, heading: 0, angVel: 0 };
  let cameraHeading = 0;
  const CAR_HALF_W = 16, CAR_LEN = 50;
  const MAX_ANG_VEL = 2.1, ANG_ACCEL = 6.5, ANG_FRICTION = 5.5;

  // Track: array of {x,y,distance,heading}
  let trackPoints = [];
  let trackHeading = 0, curveRate = 0, curveTarget = 0, distToNextTarget = 550;
  let refHeading = 0; // slow-moving baseline — total heading swing from this is capped, so
                       // the track can bend into at most a U-turn and can never loop back
                       // far enough to cross itself
  let lastTrackDist = 0, lastTX = 0, lastTY = 0;
  let progressIdx = 0;

  let fuelCans = [];        // {distance, x, y}
  let lastFuelDist = 0;
  let fuel = 100;
  const FUEL_MAX = 100, FUEL_REFILL = 38, FUEL_PICKUP_R = 42;

  let bumps = [];            // {distance, x, y, heading}
  let lastBumpDist = 0;
  let jumpTimer = 0;
  const JUMP_DURATION = 0.55, BUMP_R = 34, JUMP_SCALE_PEAK = 0.4;

  let particles = [];       // screen-space dust
  let bestScore = parseInt(localStorage.getItem('rallyDriftBest') || '0', 10);
  document.getElementById('bestDisplay').textContent = bestScore;

  // ---------- Pedal-to-speed: held = accelerate toward max, released = ease toward min ----------
  let pedalHeld = false;

  function rot(dx, dy, theta){
    const c = Math.cos(theta), s = Math.sin(theta);
    return { x: dx*c - dy*s, y: dx*s + dy*c };
  }
  function worldToScreen(wx, wy){
    const d = rot(wx - car.wx, wy - car.wy, -cameraHeading);
    return { x: W*CAR_SCREEN_X_RATIO + d.x, y: H*CAR_SCREEN_Y_RATIO + d.y };
  }

  function resetGame(){
    distanceTraveled = 0;
    speed = 300;
    pedalHeld = false;
    fuel = FUEL_MAX;
    car.wx = 0; car.wy = 0; car.heading = 0; car.angVel = 0;
    cameraHeading = 0;
    trackPoints = []; trackHeading = 0; refHeading = 0; curveRate = 0; curveTarget = 0; distToNextTarget = 550;
    lastTrackDist = 0; lastTX = 0; lastTY = 0;
    progressIdx = 0;
    fuelCans = []; lastFuelDist = 500; // no can right at the start line
    bumps = []; lastBumpDist = 700; jumpTimer = 0; // no bump right at the start line
    particles = [];
    roadWidth = 240;
    biomeName = 'tarmac'; nextBiomeChangeDist = 1900 + Math.random()*600;
    pendingBiome = null; transitionStartDist = 0;
    trackPoints.push({ x:0, y:0, distance:0, heading:0, biome:biomeName });
    generateTrackAhead();
    generateFuelCansAhead();
    generateBumpsAhead();
  }

  function currentRoadWidth(){
    return Math.max(170, 240 - distanceTraveled * 0.006);
  }

  function generateTrackAhead(){
    const needAheadDist = 2200; // keep this much track generated beyond current progress
    const difficultyCurve = 0.0035 + Math.min(0.0032, (speed-MIN_SPEED)/(MAX_SPEED-MIN_SPEED)*0.0032);
    const safeCurve = 1 / (roadWidth * 1.1); // caps curvature so the turn radius can't be tighter than 1.1x the road width
    const maxCurve = Math.min(difficultyCurve, safeCurve);
    const MAX_SWING = 2.55; // ~146°: how far the track may bend away from refHeading before
                             // being forced back — well under a full 180° U-turn, so the
                             // path geometrically cannot loop back on itself
    while (lastTrackDist < (trackPoints[progressIdx] ? trackPoints[progressIdx].distance : 0) + needAheadDist){
      distToNextTarget -= STEP;
      if (distToNextTarget <= 0 && lastTrackDist > 340){
        curveTarget = (Math.random()*2-1) * maxCurve;
        distToNextTarget = 150 + Math.random()*170;
      }
      curveRate += (curveTarget - curveRate) * 0.11;
      curveRate = Math.max(-maxCurve, Math.min(maxCurve, curveRate));
      trackHeading += curveRate * STEP;

      // Hard cap on cumulative swing from a FIXED baseline: once we've bent this far one
      // way, further turning in that same direction is refused outright — checked every
      // step, so it can never build up past this by more than a single step's worth.
      // Crucially, refHeading only snaps to the current heading once the road has come
      // back close to straight relative to it — it does NOT continuously creep along with
      // a sustained turn, otherwise a long, gentle multi-phase curve could still wind all
      // the way around into a full loop even though no single phase looked dangerous.
      const deviation = trackHeading - refHeading;
      if (deviation > MAX_SWING && curveRate > 0){
        curveRate = 0; curveTarget = -maxCurve * 0.5;
        trackHeading = refHeading + MAX_SWING;
        distToNextTarget = Math.max(distToNextTarget, 220);
      } else if (deviation < -MAX_SWING && curveRate < 0){
        curveRate = 0; curveTarget = maxCurve * 0.5;
        trackHeading = refHeading - MAX_SWING;
        distToNextTarget = Math.max(distToNextTarget, 220);
      } else if (Math.abs(deviation) < 0.35){
        refHeading = trackHeading; // road is roughly straight again — safe to re-anchor here
      }

      const nx = lastTX + Math.sin(trackHeading) * STEP;
      const ny = lastTY - Math.cos(trackHeading) * STEP;

      // Secondary safety net, on top of the MAX_SWING structural bound above: even a
      // legitimate U-turn brings its two arms fairly close together, and that alone is
      // enough for a player to cut straight across between them instead of following the
      // curve. SAFE_GAP is set well beyond how far a single legitimate turn can stretch, so
      // this only ever fires against a genuinely distant, unrelated section of the route —
      // and SAFE_DIST is generous (not just "not touching") so the two arms of any turn
      // stay far enough apart that cutting across isn't possible either.
      // Crucially this only ever nudges curveTarget, which then eases in at the SAME rate
      // as any ordinary curve — never an instant snap. An instant snap would leave a sharp,
      // unsignalled kink in the road (exactly the "road suddenly went perpendicular and
      // vanished" problem), which is worse than the thing it's trying to prevent.
      const SAFE_GAP = 1400, SAFE_DIST2 = (roadWidth * 2.4) * (roadWidth * 2.4);
      let tooClose = false;
      for (let k = 0; k < trackPoints.length; k++){
        const op = trackPoints[k];
        if (lastTrackDist + STEP - op.distance < SAFE_GAP) continue;
        const ddx = nx - op.x, ddy = ny - op.y;
        if (ddx*ddx + ddy*ddy < SAFE_DIST2){ tooClose = true; break; }
      }
      const fx = nx, fy = ny;
      if (tooClose){
        curveTarget = -Math.sign(curveRate || 1) * maxCurve;
        distToNextTarget = Math.max(distToNextTarget, 260);
      }

      lastTrackDist += STEP;
      lastTX = fx; lastTY = fy;

      // Gradual biome transition: once triggered, blend colors over TRANSITION_LEN units
      // before actually committing to the new biome, instead of a hard cut the instant
      // you arrive.
      if (!pendingBiome && lastTrackDist >= nextBiomeChangeDist){
        const options = BIOME_NAMES.filter(n => n !== biomeName);
        pendingBiome = options[Math.floor(Math.random()*options.length)];
        transitionStartDist = lastTrackDist;
      }
      let blend = 0;
      if (pendingBiome){
        blend = Math.min(1, (lastTrackDist - transitionStartDist) / TRANSITION_LEN);
        if (blend >= 1){
          biomeName = pendingBiome; pendingBiome = null; blend = 0;
          nextBiomeChangeDist = lastTrackDist + 1900 + Math.random()*1300;
        }
      }

      trackPoints.push({ x:fx, y:fy, distance:lastTrackDist, heading:trackHeading, biome:biomeName, nextBiome:pendingBiome, blend:blend });
    }
    // prune far behind current progress
    if (progressIdx > 60){
      trackPoints.splice(0, 40);
      progressIdx -= 40;
    }
  }

  function updateProgress(){
    // Prefer LOCAL continuity: search near where progressIdx already was first. This is
    // what stops the render window from suddenly "teleporting" to a different, unrelated
    // section of track that happens to pass nearby in space (e.g. a turn elsewhere on the
    // route) — that jump is what looked like "the road ends and reappears perpendicular",
    // even though the actual curve you were on was still there and continuous underneath.
    // Only fall back to scanning the whole array if the local window comes up genuinely
    // empty-handed (the car is nowhere near where we thought it was).
    const lo = Math.max(0, progressIdx-10), hi = Math.min(trackPoints.length-1, progressIdx+50);
    let bestI = progressIdx, bestD = Infinity;
    for (let i=lo; i<=hi; i++){
      const p = trackPoints[i];
      const dx = p.x-car.wx, dy = p.y-car.wy;
      const d = dx*dx+dy*dy;
      if (d < bestD){ bestD = d; bestI = i; }
    }
    const LOCAL_LIMIT2 = (roadWidth*4)*(roadWidth*4);
    if (bestD > LOCAL_LIMIT2){
      for (let i=0; i<trackPoints.length; i++){
        const p = trackPoints[i];
        const dx = p.x-car.wx, dy = p.y-car.wy;
        const d = dx*dx+dy*dy;
        if (d < bestD){ bestD = d; bestI = i; }
      }
    }
    progressIdx = bestI;
    return Math.sqrt(bestD);
  }

  function trackPointAtDistance(dist){
    if (!trackPoints.length) return null;
    if (dist <= trackPoints[0].distance) return trackPoints[0];
    const last = trackPoints[trackPoints.length-1];
    if (dist >= last.distance) return last;
    let lo = 0, hi = trackPoints.length-1;
    while (lo < hi){
      const mid = (lo+hi) >> 1;
      if (trackPoints[mid].distance < dist) lo = mid+1; else hi = mid;
    }
    return trackPoints[lo];
  }

  function generateFuelCansAhead(){
    const needAheadDist = (trackPoints[progressIdx] ? trackPoints[progressIdx].distance : 0) + 2200;
    while (lastFuelDist < needAheadDist && trackPoints.length){
      lastFuelDist += 420 + Math.random()*260;
      const tp = trackPointAtDistance(lastFuelDist);
      // sits inside the road, offset a bit off-center so you have to steer slightly for it
      const lateral = (Math.random()*2-1) * roadWidth * 0.28;
      const px = Math.cos(tp.heading), py = Math.sin(tp.heading);
      fuelCans.push({
        distance: lastFuelDist,
        biome: tp.biome,
        x: tp.x + px*lateral, y: tp.y + py*lateral
      });
    }
    while (fuelCans.length && fuelCans[0].distance < lastFuelDist - 4200) fuelCans.shift();
  }

  function generateBumpsAhead(){
    const needAheadDist = (trackPoints[progressIdx] ? trackPoints[progressIdx].distance : 0) + 2200;
    while (lastBumpDist < needAheadDist && trackPoints.length){
      lastBumpDist += 1400 + Math.random()*900;
      const tp = trackPointAtDistance(lastBumpDist);
      bumps.push({ distance: tp.distance, x: tp.x, y: tp.y, heading: tp.heading, biome: tp.biome });
    }
    while (bumps.length && bumps[0].distance < lastBumpDist - 4200) bumps.shift();
  }

  function spawnDust(sx, sy, offRoad, color, sizeMul){
    sizeMul = sizeMul || 1;
    for (let i=0;i<2;i++){
      particles.push({
        x: sx + (Math.random()*10-5), y: sy + (Math.random()*6-3),
        vx: (Math.random()*40-20), vy: 40 + Math.random()*40,
        life: 0.5 + Math.random()*0.3, maxLife: 0.8,
        r: (3 + Math.random()*4) * sizeMul,
        color: offRoad ? '150,110,60' : (color || '210,210,210')
      });
    }
  }

  function spawnRefuelBurst(sx, sy){
    for (let i=0;i<14;i++){
      const ang = Math.random()*Math.PI*2, spd = 60 + Math.random()*90;
      particles.push({
        x: sx, y: sy,
        vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 30,
        life: 0.4 + Math.random()*0.3, maxLife: 0.7,
        r: 2 + Math.random()*3,
        color: Math.random() < 0.5 ? '255,176,32' : '120,230,120'
      });
    }
  }

  // ---------- Input: left/right steer buttons ----------
  let steerLeft = false, steerRight = false;
  function bindHold(el, onDown, onUp){
    el.addEventListener('pointerdown', e => { e.preventDefault(); onDown(); el.classList.add('pressed'); initAudio(); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev =>
      el.addEventListener(ev, () => { onUp(); el.classList.remove('pressed'); }));
  }
  bindHold(document.getElementById('leftBtn'),  ()=>steerLeft=true,  ()=>steerLeft=false);
  bindHold(document.getElementById('rightBtn'), ()=>steerRight=true, ()=>steerRight=false);

  // ---------- Input: gas pedal (held = accelerate, released = coast down) ----------
  const pedalBtn = document.getElementById('pedalBtn');
  const speedBarFillEl = document.getElementById('speedBarFill');
  const fuelBarEl = document.getElementById('fuelBar');
  const fuelBarFillEl = document.getElementById('fuelBarFill');

  pedalBtn.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio();
    pedalHeld = true; pedalBtn.classList.add('pressed');
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    pedalBtn.addEventListener(ev, () => { pedalHeld = false; pedalBtn.classList.remove('pressed'); }));

  // ---------- Gas side (steer pad always sits on the opposite side) ----------
  const steerPadEl = document.getElementById('steerPad');
  let pedalSide = localStorage.getItem('rallyDriftPedalSide') || 'left';
  function applyPedalSide(){
    pedalBtn.classList.toggle('pedal-left', pedalSide === 'left');
    steerPadEl.classList.toggle('pad-right', pedalSide === 'left'); // steer pad on the other side
    document.querySelectorAll('.sideBtn').forEach(b => b.classList.toggle('active', b.dataset.side === pedalSide));
  }
  applyPedalSide();
  document.querySelectorAll('.sideBtn').forEach(b => {
    b.addEventListener('click', () => {
      pedalSide = b.dataset.side;
      localStorage.setItem('rallyDriftPedalSide', pedalSide);
      applyPedalSide();
    });
  });

  // desktop fallback: arrow keys drive the same left/right flags
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') steerLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') steerRight = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') pedalHeld = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') steerLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') steerRight = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') pedalHeld = false;
  });

  // ---------- Update ----------
  function update(dt){
    if (state !== 'playing') return;

    const speedTarget = pedalHeld ? MAX_SPEED : MIN_SPEED;
    const speedEase = pedalHeld ? 2.6 : 1.6; // gas responds quicker than coasting down
    speed += (speedTarget - speed) * Math.min(1, dt * speedEase);
    roadWidth = currentRoadWidth();

    // The faster you go, the less agile the car is — at top speed it barely turns and is
    // slow to straighten out again, so tight curves genuinely force you to ease off.
    const speedRatio = Math.max(0, Math.min(1, (speed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)));
    speedBarFillEl.style.height = (speedRatio * 100) + '%';
    speedBarFillEl.style.background = `hsl(${130 * (1 - speedRatio)},85%,50%)`;
    const steerFactor = 1 - 0.5 * speedRatio;
    const effAngAccel = ANG_ACCEL * steerFactor;
    const effMaxAngVel = MAX_ANG_VEL * steerFactor;
    const effFriction = ANG_FRICTION * (1 - 0.25 * speedRatio);

    if (jumpTimer > 0){
      // airborne over a bump — no steering input accepted, it just eases straight
      if (car.angVel > 0) car.angVel = Math.max(0, car.angVel - effFriction*dt);
      else car.angVel = Math.min(0, car.angVel + effFriction*dt);
    } else if (steerLeft && !steerRight) car.angVel -= effAngAccel * dt;
    else if (steerRight && !steerLeft) car.angVel += effAngAccel * dt;
    else {
      if (car.angVel > 0) car.angVel = Math.max(0, car.angVel - effFriction*dt);
      else car.angVel = Math.min(0, car.angVel + effFriction*dt);
    }
    car.angVel = Math.max(-effMaxAngVel, Math.min(effMaxAngVel, car.angVel));
    car.heading += car.angVel * dt;

    car.wx += Math.sin(car.heading) * speed * dt;
    car.wy -= Math.cos(car.heading) * speed * dt;
    distanceTraveled += speed * dt;

    // camera eases toward the car's heading -> road visibly rotates with a little lag
    let diff = car.heading - cameraHeading;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    cameraHeading += diff * Math.min(1, dt * 7.5);

    generateTrackAhead();
    generateFuelCansAhead();
    generateBumpsAhead();
    const offset = updateProgress();

    jumpTimer = Math.max(0, jumpTimer - dt);
    if (jumpTimer <= 0){
      const carDist = trackPoints[progressIdx] ? trackPoints[progressIdx].distance : null;
      for (const bmp of bumps){
        if (bmp.triggered) continue;
        let hit = carDist !== null && Math.abs(carDist - bmp.distance) < STEP*2;
        if (!hit){
          const ddx = bmp.x - car.wx, ddy = bmp.y - car.wy;
          hit = (ddx*ddx + ddy*ddy) < (roadWidth*0.65) * (roadWidth*0.65);
        }
        if (hit){
          bmp.triggered = true;
          jumpTimer = JUMP_DURATION;
          break;
        }
      }
    }

    // fuel is spent per distance covered (not per second) — crawling along slowly no
    // longer lets you "farm" cans for free, since the total cost over a stretch of road
    // is the same regardless of how long it takes you to cross it. Pushing hard still
    // costs a bit more per meter, same as real fuel economy.
    fuel -= (0.020 + speedRatio * 0.014) * (speed * dt);
    fuel = Math.max(0, fuel);
    fuelBarFillEl.style.height = fuel + '%';
    fuelBarEl.classList.toggle('critical', fuel < 20);

    // pick up any fuel can close enough to the car
    for (let i=fuelCans.length-1; i>=0; i--){
      const c = fuelCans[i];
      const ddx = c.x - car.wx, ddy = c.y - car.wy;
      if (ddx*ddx + ddy*ddy < FUEL_PICKUP_R*FUEL_PICKUP_R){
        fuel = Math.min(FUEL_MAX, fuel + FUEL_REFILL);
        spawnRefuelBurst(W*CAR_SCREEN_X_RATIO, H*CAR_SCREEN_Y_RATIO - 20);
        playRefuel();
        fuelCans.splice(i, 1);
      }
    }

    if (fuel <= 0){
      outOfFuel();
      return;
    }

    // less forgiving off-road buffer at high speed — mistakes are punished harder
    const rumbleW = 26 - 14 * speedRatio;
    let offRoadState = 'ok';
    if (offset > roadWidth/2 + rumbleW) offRoadState = 'crash';
    else if (offset > roadWidth/2) offRoadState = 'rumble';

    const carScreenX = W*CAR_SCREEN_X_RATIO, carScreenY = H*CAR_SCREEN_Y_RATIO;
    const dustBiome = BIOMES[(trackPoints[progressIdx] && trackPoints[progressIdx].biome)] || BIOMES.tarmac;
    if (jumpTimer > 0){
      // airborne — no dust while off the ground
    } else if (offRoadState === 'rumble'){
      speed *= 0.992;
      if (Math.random() < 0.6) spawnDust(carScreenX + (Math.random()*20-10), carScreenY + CAR_LEN*0.3, true);
    } else if (Math.random() < dustBiome.dustRate) {
      spawnDust(carScreenX, carScreenY + CAR_LEN*0.32, false, dustBiome.dust, dustBiome.dustSize);
    }

    if (offRoadState === 'crash'){
      crash();
      return;
    }

    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i,1);
    }

    setEngine((speed-MIN_SPEED)/(MAX_SPEED-MIN_SPEED), true);

    const meters = Math.floor(distanceTraveled/9);
    document.getElementById('scoreDisplay').textContent = meters + ' m';
    document.getElementById('speedDisplay').textContent = Math.round(speed*0.42) + ' km/h';
  }

  function endRun(title){
    state = 'crashed';
    setEngine(0,false);
    const meters = Math.floor(distanceTraveled/9);
    const isBest = meters > bestScore;
    if (isBest){ bestScore = meters; localStorage.setItem('rallyDriftBest', bestScore); }
    document.getElementById('bestDisplay').textContent = bestScore;

    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlayTagline').style.display = 'none';
    document.getElementById('resultStats').style.display = 'block';
    document.getElementById('finalScore').textContent = meters + ' m';
    document.getElementById('newBestTag').style.display = isBest ? 'block' : 'none';
    document.getElementById('startBtn').textContent = 'RETRY';
    document.getElementById('overlay').classList.remove('hidden');
  }
  function crash(){
    playCrash();
    endRun('CRASHED!');
  }
  function outOfFuel(){
    endRun('OUT OF FUEL!');
  }

  // ---------- Draw ----------
  function blendedColors(point){
    const cur = BIOMES[point.biome] || BIOMES.tarmac;
    if (!point.nextBiome || !point.blend) return cur;
    const nxt = BIOMES[point.nextBiome];
    const t = point.blend;
    return {
      road: lerpColor(cur.road, nxt.road, t),
      stripeA: lerpColor(cur.stripeA, nxt.stripeA, t),
      stripeB: lerpColor(cur.stripeB, nxt.stripeB, t),
      bg: lerpColor(cur.bg, nxt.bg, t),
      bg2: cur.bg2,
      sand: t > 0.5 ? nxt.sand : cur.sand,
      sandWidth: t > 0.5 ? nxt.sandWidth : cur.sandWidth,
      curbs: t > 0.5 ? nxt.curbs : cur.curbs
    };
  }

  function draw(){
    const carPoint = trackPoints[progressIdx];
    const activeColors = carPoint ? blendedColors(carPoint) : BIOMES.tarmac;

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = activeColors.bg;
    ctx.fillRect(0,0,W,H);

    // rotated scrolling ground stripes, drawn as bands perpendicular to track direction near the car
    ctx.save();
    ctx.translate(W*CAR_SCREEN_X_RATIO, H*CAR_SCREEN_Y_RATIO);
    ctx.rotate(-cameraHeading);
    ctx.fillStyle = activeColors.bg2;
    const stripeH = 46;
    const off = ((car.wy % (stripeH*2)) + stripeH*2) % (stripeH*2);
    const span = Math.max(W,H)*1.6;
    for (let y = -span + off; y < span; y += stripeH*2){
      ctx.fillRect(-span, y - car.wy, span*2, stripeH);
    }
    ctx.restore();

    if (!trackPoints.length){ return; }

    const rw = roadWidth;
    const lo = Math.max(0, progressIdx-15);
    const hi = Math.min(trackPoints.length-1, progressIdx+110);

    function drawRoadQuad(i){
      const a = trackPoints[i], b = trackPoints[i+1];
      const biome = blendedColors(a);
      const apx = Math.cos(a.heading), apy = Math.sin(a.heading);
      const bpx = Math.cos(b.heading), bpy = Math.sin(b.heading);
      const aL = worldToScreen(a.x - apx*rw/2, a.y - apy*rw/2);
      const aR = worldToScreen(a.x + apx*rw/2, a.y + apy*rw/2);
      const bL = worldToScreen(b.x - bpx*rw/2, b.y - bpy*rw/2);
      const bR = worldToScreen(b.x + bpx*rw/2, b.y + bpy*rw/2);

      // beach stretch: a sand band hugging both edges of the road, water is the background
      if (biome.sand){
        const sw = biome.sandWidth;
        ctx.fillStyle = biome.sand;
        for (const side of [-1,1]){
          const aS = worldToScreen(a.x + apx*side*(rw/2+sw), a.y + apy*side*(rw/2+sw));
          const aE = worldToScreen(a.x + apx*side*(rw/2), a.y + apy*side*(rw/2));
          const bS = worldToScreen(b.x + bpx*side*(rw/2+sw), b.y + bpy*side*(rw/2+sw));
          const bE = worldToScreen(b.x + bpx*side*(rw/2), b.y + bpy*side*(rw/2));
          ctx.beginPath();
          ctx.moveTo(aS.x, aS.y); ctx.lineTo(aE.x, aE.y);
          ctx.lineTo(bE.x, bE.y); ctx.lineTo(bS.x, bS.y);
          ctx.closePath(); ctx.fill();
        }
      }

      ctx.beginPath();
      ctx.moveTo(aL.x, aL.y); ctx.lineTo(aR.x, aR.y);
      ctx.lineTo(bR.x, bR.y); ctx.lineTo(bL.x, bL.y);
      ctx.closePath();
      ctx.fillStyle = biome.road;
      ctx.fill();

      if (biome.curbs){
        const stripeOn = Math.floor(a.distance / 34) % 2 === 0;
        ctx.strokeStyle = stripeOn ? biome.stripeA : biome.stripeB;
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(aL.x, aL.y); ctx.lineTo(bL.x, bL.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(aR.x, aR.y); ctx.lineTo(bR.x, bR.y); ctx.stroke();
      }
    }

    for (let i=lo; i<hi; i++) drawRoadQuad(i);

    // fuel cans
    for (const c of fuelCans){
      const s = worldToScreen(c.x, c.y);
      if (s.x < -120 || s.x > W+120 || s.y < -120 || s.y > H+120) continue;
      drawFuelCan(s.x, s.y, -cameraHeading);
    }

    // bumps (drawn at road level, before the car so it visually rides over them)
    for (const bmp of bumps){
      const s = worldToScreen(bmp.x, bmp.y);
      if (s.x < -220 || s.x > W+220 || s.y < -220 || s.y > H+220) continue;
      drawBump(bmp, -cameraHeading);
    }

    // dust particles (screen space)
    for (const p of particles){
      const a = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = `rgba(${p.color},${a*0.55})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }

    // car
    if (state !== 'idle'){
      let jumpScale = 1;
      if (jumpTimer > 0){
        const t = 1 - jumpTimer / JUMP_DURATION; // 0 -> 1 over the jump
        jumpScale = 1 + JUMP_SCALE_PEAK * Math.sin(t * Math.PI);
      }
      drawCar(W*CAR_SCREEN_X_RATIO, H*CAR_SCREEN_Y_RATIO, car.heading - cameraHeading, jumpScale);
    }
  }

  function drawBump(bmp, worldRot){
    const halfW = roadWidth/2 - 7; // stay inset from the road edges, not overflowing onto the shoulder
    const perpWx = Math.cos(bmp.heading), perpWy = Math.sin(bmp.heading);
    const L = worldToScreen(bmp.x - perpWx*halfW, bmp.y - perpWy*halfW);
    const R = worldToScreen(bmp.x + perpWx*halfW, bmp.y + perpWy*halfW);
    ctx.save();
    ctx.lineCap = 'butt'; // no rounded overhang past the endpoints

    if (bmp.biome === 'tarmac'){
      // classic painted speed bump
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#222';
      ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(R.x, R.y); ctx.stroke();
      ctx.setLineDash([16, 14]);
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#f2c531';
      ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(R.x, R.y); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      // earth/sand mound in the biome's own ground tone — layered offset strokes fake the
      // raised 3D shape: dark ground shadow, dark base, mid-tone body, lit crest on top
      const base = (BIOMES[bmp.biome] && BIOMES[bmp.biome].dust) || '180,150,110';

      ctx.strokeStyle = 'rgba(0,0,0,0.28)';
      ctx.lineWidth = 20;
      ctx.beginPath(); ctx.moveTo(L.x, L.y+7); ctx.lineTo(R.x, R.y+7); ctx.stroke();

      ctx.strokeStyle = `rgb(${shadeRGB(base, 0.55)})`;
      ctx.lineWidth = 22;
      ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(R.x, R.y); ctx.stroke();

      ctx.strokeStyle = `rgb(${shadeRGB(base, 0.82)})`;
      ctx.lineWidth = 15;
      ctx.beginPath(); ctx.moveTo(L.x, L.y-3); ctx.lineTo(R.x, R.y-3); ctx.stroke();

      ctx.strokeStyle = `rgb(${shadeRGB(base, 1.22)})`;
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(L.x, L.y-6); ctx.lineTo(R.x, R.y-6); ctx.stroke();
    }

    ctx.restore();
  }

  function drawFuelCan(x, y, worldRot){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(worldRot);
    const pulse = 1 + Math.sin(performance.now()/220) * 0.08;
    ctx.scale(pulse, pulse);
    // ground shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(1, 8, 9, 4, 0, 0, Math.PI*2); ctx.fill();
    // can body
    ctx.fillStyle = '#e6473b';
    ctx.fillRect(-8, -9, 16, 17);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(-8, -1, 16, 4);
    // cap + handle
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-3, -13, 6, 5);
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-5, -9); ctx.lineTo(-5, -15); ctx.lineTo(5, -15); ctx.lineTo(5, -9); ctx.stroke();
    ctx.restore();
  }

  function drawCar(x, y, angle, scale){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (scale && scale !== 1) ctx.scale(scale, scale);

    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(2, 6, CAR_HALF_W+3, CAR_LEN/2+2, 0, 0, Math.PI*2);
    ctx.fill();

    const grad = ctx.createLinearGradient(0,-CAR_LEN/2,0,CAR_LEN/2);
    grad.addColorStop(0, '#ff6a3d');
    grad.addColorStop(1, '#c93f1e');
    ctx.fillStyle = grad;
    roundRect(-CAR_HALF_W, -CAR_LEN/2, CAR_HALF_W*2, CAR_LEN, 8);
    ctx.fill();

    ctx.fillStyle = '#1c2733';
    roundRect(-CAR_HALF_W+4, -6, CAR_HALF_W*2-8, 20, 4);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -CAR_LEN/2+2, 6, CAR_LEN-4);

    ctx.fillStyle = '#ffe9a8';
    ctx.fillRect(-CAR_HALF_W+1, -CAR_LEN/2+1, 5, 5);
    ctx.fillRect(CAR_HALF_W-6, -CAR_LEN/2+1, 5, 5);

    ctx.fillStyle = '#161616';
    ctx.fillRect(-CAR_HALF_W-3, -CAR_LEN/2+4, 5, 12);
    ctx.fillRect(CAR_HALF_W-2, -CAR_LEN/2+4, 5, 12);
    ctx.fillRect(-CAR_HALF_W-3, CAR_LEN/2-16, 5, 12);
    ctx.fillRect(CAR_HALF_W-2, CAR_LEN/2-16, 5, 12);

    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- Loop ----------
  let lastTs = null;
  function loop(ts){
    if (lastTs == null) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    dt = Math.min(dt, 0.033);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    resetGame();
    state = 'playing';
    document.getElementById('overlay').classList.add('hidden');
  });

  resetGame();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
