<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QUADRIS — square puzzle</title>
<style>
  :root{
    --bg: #0b0d14;
    --panel: #12151f;
    --line: #1f2433;
    --ink: #e8ecf7;
    --dim: #6b7290;
    --danger: #ff4d5e;
    --c-yellow: #ffcc33;
    --c-red: #ff4757;
    --c-green: #2ed573;
    --c-blue: #3a86ff;
    --c-orange: #ff8c1a;
    --c-purple: #a259ff;
    --c-gray: #9aa3b8;
  }
  *{box-sizing:border-box;}
  html{
    margin:0;
    height:100%;
    overflow:hidden;
  }
  body{
    margin:0;
    width:100%;
    height:100vh;
    height:100dvh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #171b2a 0%, var(--bg) 60%);
    color:var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage{
    width:100%; max-width:720px;
    height:100%;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .title{
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
    gap:10px;
  }
  .title h1{
    font-size: clamp(19px, 6.5vw, 26px);
    letter-spacing:2px;
    margin:0;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-shadow: 0 0 10px rgba(58,134,255,.45);
    min-width:0;
  }
  .title h1 span{ color: var(--c-yellow); text-shadow:0 0 10px rgba(255,204,51,.5); }

  .board-wrap{
    position:relative;
    border:1px solid var(--line);
    background:
      linear-gradient(180deg, #10131c 0%, #0d0f17 100%);
    border-radius:14px;
    padding:8px;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .score-badge{
    position:absolute;
    top:8px; right:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px 12px;
    text-align:center;
    z-index:10;
  }
  .score-label{ font-size:9px; color:var(--dim); letter-spacing:1px; }
  .score-value{ font-size:16px; font-weight:800; color:var(--ink); line-height:1.2; }

  .queue-bar{
    width:100%;
    display:flex; align-items:flex-end; justify-content:center; gap:12px;
    padding:2px 0 8px;
    flex-shrink:0;
  }
  .queue-piece-wrap{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .queue-bar .shots-track{
    flex:0 1 90px;
    display:flex; gap:4px;
    margin-bottom:6px;
  }

  .board-frame{
    position:relative;
    flex:0 0 auto;
  }
  .board{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap:3px;
    position:absolute;
    inset:0;
    cursor:pointer;
    touch-action:manipulation;
  }
  .danger-line{
    position:absolute;
    left:0; right:0;
    bottom: 10%;
    height:2px;
    background: repeating-linear-gradient(90deg, var(--danger) 0 8px, transparent 8px 14px);
    opacity:.55;
    animation: pulse 1.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{ 0%,100%{opacity:.25;} 50%{opacity:.7;} }

  .cell{
    border-radius:6px;
    background: #161a26;
    position:relative;
    transition: transform .12s ease;
  }
  .cell.filled{
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 3px 0 rgba(0,0,0,.35);
  }
  .cell.pop{
    animation: pop .28s ease forwards;
  }
  @keyframes pop{
    0%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(.25); opacity:0; }
  }
  .cell.drop{
    animation: drop .18s ease;
  }
  @keyframes drop{
    0%{ transform: translateY(-14px); }
    100%{ transform: translateY(0); }
  }

  @keyframes explode{
    0%{ transform:scale(1); opacity:1; }
    35%{ transform:scale(1.35); opacity:1; box-shadow:0 0 22px 6px rgba(255,255,255,.9); }
    100%{ transform:scale(.1); opacity:0; }
  }
  .cell.exploding{
    animation: explode .32s ease forwards;
    z-index:3;
  }

  @keyframes fall-away{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(260%); opacity:0; }
  }
  .cell.falling{
    animation: fall-away .38s cubic-bezier(.55,0,1,.45) forwards;
    z-index:2;
  }

  .shot-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
  }
  @keyframes fly-up{
    from{ top: var(--start-top); }
    to{ top: var(--end-top); }
  }
  .projectile{
    position:absolute;
    box-sizing:border-box;
    padding:3px;
    background-clip:content-box;
    border-radius:9px;
    animation: fly-up .17s linear forwards;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; line-height:1;
    color:#fff;
  }

  .next-label{ font-size:9px; color:var(--dim); letter-spacing:1px; }
  .next-piece{
    width:30px; height:30px; border-radius:7px;
    flex-shrink:0;
    background:#232838;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; line-height:1;
  }
  .next-piece.small{ width:22px; height:22px; font-size:12px; }
  .shot-dot{
    height:5px; flex:1; border-radius:3px; background:#232a3d;
  }
  .shot-dot.on{ background: var(--c-blue); box-shadow:0 0 8px rgba(58,134,255,.6);}


  .overlay{
    position:absolute; inset:0;
    background:rgba(8,9,14,.88);
    border-radius:14px;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:14px;
    text-align:center;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .overlay h2{ margin:0; font-size:22px; letter-spacing:3px; color:var(--danger); }
  .overlay p{ margin:0; color:var(--dim); font-size:13px; }
  .overlay button{
    background: var(--c-blue); color:#04070f; border:none;
    padding:10px 22px; border-radius:8px; font-weight:800;
    letter-spacing:1px; cursor:pointer; font-family:inherit;
    touch-action:manipulation;
  }  .help-btn{
    width:24px; height:24px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--dim);
    font-family:inherit;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .help-btn:active{ transform:scale(.92); }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(5,6,10,.75);
    display:none;
    align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    max-width:380px;
    text-align:center;
  }
  .modal-box h2{
    margin:0 0 10px;
    font-size:16px; letter-spacing:2px; color:var(--ink);
  }
  .modal-box p{
    margin:0 0 16px;
    font-size:13px; color:var(--dim); line-height:1.5;
  }
  .modal-box button{
    background: var(--c-blue); color:#04070f; border:none;
    padding:10px 22px; border-radius:8px; font-weight:800;
    letter-spacing:1px; cursor:pointer; font-family:inherit;
    touch-action:manipulation;
  }

  /* le regole colore stanno per ultime: vincono sempre sulla cascata */
  .yellow{ background: var(--c-yellow); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(255,204,51,.35);}
  .red{    background: var(--c-red); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(255,71,87,.35);}
  .green{  background: var(--c-green); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(46,213,115,.35);}
  .blue{   background: var(--c-blue); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(58,134,255,.35);}
  .orange{ background: var(--c-orange); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(255,140,26,.35);}
  .purple{ background: var(--c-purple); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(162,89,255,.35);}
  .gray{   background: var(--c-gray); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(154,163,184,.35);}
  .flame{  background: radial-gradient(circle at 50% 30%, #ffe066, #ff5e1a 55%, #b3230a 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3), 0 0 14px rgba(255,94,26,.6);}
  .bomb{   background: radial-gradient(circle at 35% 30%, #7a8194, #262a36 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 12px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div class="stage">
  <div class="title">
    <h1>QUAD<span>RIS</span></h1>
    <button id="helpBtn" class="help-btn" aria-label="How to play">?</button>
  </div>

  <div class="board-wrap">
    <div class="score-badge">
      <div class="score-label">SCORE</div>
      <div class="score-value" id="score">0</div>
    </div>

    <div class="queue-bar">
      <div class="queue-piece-wrap">
        <span class="next-label">LOADED</span>
        <div class="next-piece" id="currentPiece"></div>
      </div>
      <div class="shots-track" id="shotsTrack"></div>
      <div class="queue-piece-wrap">
        <span class="next-label">NEXT</span>
        <div class="next-piece small" id="nextPiece"></div>
      </div>
    </div>

    <div class="board-frame">
      <div class="board" id="board"></div>
      <div class="shot-layer" id="shotLayer"></div>
      <div class="danger-line"></div>
    </div>
    <div class="overlay" id="overlay">
      <h2>STACK REACHED</h2>
      <p id="finalScore">Final score: 0</p>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="helpModal">
  <div class="modal-box">
    <h2>How to play</h2>
    <p>Tap a column directly: the piece rises and attaches under the last block. Occasionally you'll get 🔥 (clears the whole column) or 💣 (diamond blast: 3-5-3 cells). Game over when no moves are left.</p>
    <button id="closeHelpBtn">Got it</button>
  </div>
</div>

<script>
(function(){
  const ROWS = 10, COLS = 6, DROP_INTERVAL = 5;
  const BASE_COLORS = ['yellow','red','green','blue'];
  const UNLOCK_QUEUE = ['orange','purple','gray'];
  const COLOR_NAMES = {
    yellow:'Yellow', red:'Red', green:'Green', blue:'Blue',
    orange:'Orange', purple:'Purple', gray:'Gray'
  };
  let activeColors, unlockIndex;
  let grid, currentColor, nextColor, shotsSinceDrop, totalShots, score, gameOver;
  let explodingCells = new Set();
  let fallingCells = new Set();

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const currentPieceEl = document.getElementById('currentPiece');
  const nextPieceEl = document.getElementById('nextPiece');
  const shotsTrackEl = document.getElementById('shotsTrack');
  const overlayEl = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');

  function randomColor(){ return activeColors[Math.floor(Math.random()*activeColors.length)]; }

  function makeRandomRow(fillChance){
    const row = new Array(COLS).fill(null);
    for(let c=0;c<COLS;c++){
      if(Math.random() < fillChance) row[c] = randomColor();
    }
    return row;
  }

  function randomPiece(){
    const roll = Math.random();
    if(roll < 0.04) return 'flame';
    if(roll < 0.08) return 'bomb';
    return randomColor();
  }

  function isSpecial(piece){
    return piece === 'flame' || piece === 'bomb';
  }

  function pieceEmoji(piece){
    if(piece === 'flame') return '🔥';
    if(piece === 'bomb') return '💣';
    return '';
  }

  function init(){
    activeColors = BASE_COLORS.slice();
    unlockIndex = 0;
    grid = [];
    for(let r=0;r<ROWS;r++){
      if(r < 4) grid.push(makeRandomRow(1)); // first 4 rows fully filled
      else grid.push(new Array(COLS).fill(null));
    }
    currentColor = randomColor();
    nextColor = randomColor();
    shotsSinceDrop = 0;
    totalShots = 0;
    score = 0;
    gameOver = false;
    animating = false;
    explodingCells.clear();
    fallingCells.clear();
    overlayEl.classList.remove('show');
    buildBoardDOM();
    render();
  }

  function fitBoard(){
    const wrap = document.querySelector('.board-wrap');
    const frame = document.querySelector('.board-frame');
    const queueBar = document.querySelector('.queue-bar');
    if(!wrap || !frame) return;
    const GAP = 3;
    const PAD = 8; // board-wrap padding, each side
    const queueH = queueBar ? queueBar.getBoundingClientRect().height : 0;
    const availW = wrap.clientWidth - PAD * 2;
    const availH = wrap.clientHeight - PAD * 2 - queueH;
    let cell = Math.min(
      (availW - GAP * (COLS - 1)) / COLS,
      (availH - GAP * (ROWS - 1)) / ROWS
    );
    cell = Math.max(cell, 10);
    frame.style.width = (cell * COLS + GAP * (COLS - 1)) + 'px';
    frame.style.height = (cell * ROWS + GAP * (ROWS - 1)) + 'px';
    frame.style.flex = '0 0 auto';
  }
  window.addEventListener('resize', fitBoard);

  function buildBoardDOM(){
    boardEl.innerHTML = '';
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        boardEl.appendChild(cell);
      }
    }
  }

  boardEl.addEventListener('click', (e)=>{
    const rect = boardEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const col = Math.floor((x / rect.width) * COLS);
    if(col >= 0 && col < COLS) shoot(col);
  });

  function render(){
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const idx = r*COLS+c;
        const cell = boardEl.children[idx];
        const val = grid[r][c];
        const key = r+','+c;
        let cls = 'cell' + (val ? ' filled '+val : '');
        if(explodingCells.has(key)) cls += ' exploding';
        if(fallingCells.has(key)) cls += ' falling';
        cell.className = cls;
      }
    }
    scoreEl.textContent = score;
    nextPieceEl.className = 'next-piece small ' + nextColor;
    nextPieceEl.textContent = pieceEmoji(nextColor);
    currentPieceEl.className = 'next-piece ' + currentColor;
    currentPieceEl.textContent = pieceEmoji(currentColor);

    shotsTrackEl.innerHTML = '';
    for(let i=0;i<DROP_INTERVAL;i++){
      const dot = document.createElement('div');
      dot.className = 'shot-dot' + (i < shotsSinceDrop ? ' on' : '');
      shotsTrackEl.appendChild(dot);
    }

    fitBoard();
  }

  function lowestFilledRow(col){
    for(let r=ROWS-1;r>=0;r--){
      if(grid[r][col] !== null) return r;
    }
    return -1; // empty column
  }

  function landingRow(col){
    const lf = lowestFilledRow(col);
    return lf + 1; // attaches right below the last filled block (or at the top, if empty)
  }

  function isColumnFull(col){
    return lowestFilledRow(col) === ROWS - 1;
  }

  function neighbors(r,c){
    return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(
      ([nr,nc]) => nr>=0 && nr<ROWS && nc>=0 && nc<COLS
    );
  }

  function findGroup(r,c){
    const color = grid[r][c];
    if(!color) return [];
    const seen = new Set();
    const stack = [[r,c]];
    const group = [];
    while(stack.length){
      const [cr,cc] = stack.pop();
      const key = cr+','+cc;
      if(seen.has(key)) continue;
      seen.add(key);
      if(grid[cr][cc] !== color) continue;
      group.push([cr,cc]);
      for(const [nr,nc] of neighbors(cr,cc)) stack.push([nr,nc]);
    }
    return group;
  }

  function computeSupported(){
    const supported = new Set();
    const stack = [];
    for(let c=0;c<COLS;c++){
      if(grid[0][c] !== null){
        const key = '0,'+c;
        supported.add(key);
        stack.push([0,c]);
      }
    }
    while(stack.length){
      const [r,c] = stack.pop();
      for(const [nr,nc] of neighbors(r,c)){
        if(grid[nr][nc] !== null){
          const key = nr+','+nc;
          if(!supported.has(key)){
            supported.add(key);
            stack.push([nr,nc]);
          }
        }
      }
    }
    return supported;
  }

  function explodeCells(cells, cb, pointsPerCell){
    if(cells.length === 0){ cb(); return; }
    cells.forEach(([r,c]) => explodingCells.add(r+','+c));
    render();
    setTimeout(()=>{
      cells.forEach(([r,c]) => {
        grid[r][c] = null;
        explodingCells.delete(r+','+c);
      });
      score += cells.length * pointsPerCell;
      render();
      cb();
    }, 300);
  }

  function explodeGroup(group, cb){
    explodeCells(group, cb, 10);
  }

  function explodeColumn(col, cb){
    const cells = [];
    for(let r=0;r<ROWS;r++){
      if(grid[r][col] !== null) cells.push([r,col]);
    }
    explodeCells(cells, cb, 12);
  }

  function explodeBomb(centerRow, centerCol, cb){
    const cellSet = new Map();
    const spans = [
      [centerRow - 1, 1],
      [centerRow,     2],
      [centerRow + 1, 1]
    ];
    for(const [r, halfWidth] of spans){
      if(r < 0 || r >= ROWS) continue;
      for(let c = centerCol - halfWidth; c <= centerCol + halfWidth; c++){
        if(c >= 0 && c < COLS && grid[r][c] !== null) cellSet.set(r+','+c, [r,c]);
      }
    }
    explodeCells(Array.from(cellSet.values()), cb, 12);
  }

  function animateFloatingFall(cb){
    const supported = computeSupported();
    const toFall = [];
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        if(grid[r][c] !== null && !supported.has(r+','+c)) toFall.push([r,c]);
      }
    }
    if(toFall.length === 0){ cb(); return; }
    toFall.forEach(([r,c]) => fallingCells.add(r+','+c));
    render();
    setTimeout(()=>{
      toFall.forEach(([r,c]) => {
        grid[r][c] = null;
        fallingCells.delete(r+','+c);
      });
      score += toFall.length * 5;
      render();
      cb();
    }, 360);
  }

  let animating = false;

  function animateShot(col, row, color, cb){
    let done = false;
    const finish = ()=>{
      if(done) return;
      done = true;
      cb();
    };
    // absolute fallback: whatever happens with the animation,
    // the game always resumes shortly after (never stuck)
    setTimeout(finish, 260);

    try{
      const shotLayer = document.getElementById('shotLayer');
      const colPct = 100 / COLS;
      const rowPct = 100 / ROWS;

      const proj = document.createElement('div');
      proj.className = 'projectile ' + color;
      proj.textContent = pieceEmoji(color);
      proj.style.width = colPct + '%';
      proj.style.height = rowPct + '%';
      proj.style.left = (colPct * col) + '%';
      proj.style.setProperty('--start-top', (rowPct * ROWS) + '%');
      proj.style.setProperty('--end-top', (rowPct * row) + '%');
      proj.style.top = (rowPct * row) + '%'; // safe final position
      shotLayer.appendChild(proj);

      proj.addEventListener('animationend', ()=>{ proj.remove(); finish(); });
      setTimeout(()=>{ if(proj.parentNode) proj.remove(); }, 400);
    }catch(e){
      // if something goes wrong drawing the animation,
      // the setTimeout above still moves the game forward
    }
  }

  function maybeUnlockColor(){
    if(totalShots % 10 === 0 && unlockIndex < UNLOCK_QUEUE.length){
      activeColors.push(UNLOCK_QUEUE[unlockIndex]);
      unlockIndex++;
    }
  }

  function finishTurn(){
    animateFloatingFall(()=>{
      if(shotsSinceDrop >= DROP_INTERVAL){
        shotsSinceDrop = 0;
        descend();
      }
      currentColor = nextColor;
      nextColor = randomPiece();
      animating = false;
      render();
      if(noMovesPossible()) triggerGameOver();
    });
  }

  function noMovesPossible(){
    if(gameOver) return false;
    if(isSpecial(currentColor)) return false; // flame/bomb always work
    for(let c=0;c<COLS;c++){
      if(!isColumnFull(c)) return false;
    }
    return true;
  }

  function shoot(col){
    if(gameOver || animating) return;
    const piece = currentColor;
    if(!isSpecial(piece) && isColumnFull(col)) return;

    let targetRow;
    if(piece === 'flame'){
      targetRow = 0;
    } else if(piece === 'bomb'){
      targetRow = Math.min(landingRow(col), ROWS - 1);
    } else {
      targetRow = landingRow(col);
    }

    animating = true;

    animateShot(col, targetRow, piece, ()=>{
      totalShots++;
      shotsSinceDrop++;
      maybeUnlockColor();

      if(piece === 'flame'){
        render();
        explodeColumn(col, finishTurn);
      } else if(piece === 'bomb'){
        render();
        explodeBomb(targetRow, col, finishTurn);
      } else {
        grid[targetRow][col] = piece;
        render();
        const group = findGroup(targetRow, col);
        if(group.length >= 3){
          explodeGroup(group, finishTurn);
        } else {
          finishTurn();
        }
      }
    });
  }

  function descend(){
    // if the bottom row is already occupied, it would breach the shooter: game over
    const bottomRowFull = grid[ROWS-1].some(v => v !== null);
    if(bottomRowFull){
      triggerGameOver();
      return;
    }
    const newRow = makeRandomRow(1);
    for(let r=ROWS-1;r>0;r--){
      grid[r] = grid[r-1].slice();
    }
    grid[0] = newRow;
  }

  function triggerGameOver(){
    gameOver = true;
    finalScoreEl.textContent = 'Final score: ' + score;
    overlayEl.classList.add('show');
  }

  document.getElementById('restartBtn').addEventListener('click', init);

  const helpModal = document.getElementById('helpModal');
  document.getElementById('helpBtn').addEventListener('click', ()=>{
    helpModal.classList.add('show');
  });
  document.getElementById('closeHelpBtn').addEventListener('click', ()=>{
    helpModal.classList.remove('show');
  });
  helpModal.addEventListener('click', (e)=>{
    if(e.target === helpModal) helpModal.classList.remove('show');
  });

  init();
})();
</script>
</body>
</html>
